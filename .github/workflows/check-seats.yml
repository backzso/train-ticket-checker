name: Check Train Seats

on:
  schedule:
    # Her gün 09:00 UTC (Türkiye saatiyle 12:00)
    - cron: '0 9 * * *'
  workflow_dispatch:

# Aynı anda birden fazla kontrol çalışmasını engelle.
concurrency:
  group: check-seats
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check seat availability
        run: node dist/index.js
        env:
          TCDD_ENDPOINT: ${{ secrets.TCDD_ENDPOINT }}
          DEPARTURE_STATION_ID: ${{ secrets.DEPARTURE_STATION_ID }}
          DEPARTURE_STATION_NAME: ${{ secrets.DEPARTURE_STATION_NAME }}
          ARRIVAL_STATION_ID: ${{ secrets.ARRIVAL_STATION_ID }}
          ARRIVAL_STATION_NAME: ${{ secrets.ARRIVAL_STATION_NAME }}
          DEPARTURE_DATE: ${{ secrets.DEPARTURE_DATE }}
          TCDD_AUTH_TOKEN: ${{ secrets.TCDD_AUTH_TOKEN }}
          UNIT_ID: ${{ secrets.UNIT_ID }}
          CHECK_START: ${{ secrets.CHECK_START }}
          CHECK_END: ${{ secrets.CHECK_END }}
          POLL_INTERVAL_MINUTES: ${{ secrets.POLL_INTERVAL_MINUTES }}
          CHECK_MULTIPLE_DATES: ${{ secrets.CHECK_MULTIPLE_DATES }}
          MAX_DAYS_TO_CHECK: ${{ secrets.MAX_DAYS_TO_CHECK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_NOTIFICATIONS: ${{ secrets.SEND_NOTIFICATIONS }}
