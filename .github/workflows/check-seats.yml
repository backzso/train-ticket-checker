name: Check Train Seats

on:
  schedule:
    # Türkiye saatiyle ~06:00-24:00 arası her saat başı tetiklenir (UTC 03-21).
    # Her tetikleme ~55 dakika çalıştığı için kapsama neredeyse kesintisizdir.
    # Kapsama saatleri CHECK_START/CHECK_END secret'larıyla sınırlanır.
    - cron: '0 3-21 * * *'
  workflow_dispatch:

# Aynı anda birden fazla kontrol çalışmasını engelle (üst üste binmesin).
concurrency:
  group: check-seats
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # MAX_RUNTIME_MINUTES'tan biraz uzun: iş kendi kendine çıkamazsa güvenlik ağı.
    timeout-minutes: 58

    env:
      TZ: Europe/Istanbul

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check seat availability (continuous ~50 min, every 5 min)
        run: node dist/index.js --continuous
        env:
          TCDD_ENDPOINT: ${{ secrets.TCDD_ENDPOINT }}
          DEPARTURE_STATION_ID: ${{ secrets.DEPARTURE_STATION_ID }}
          DEPARTURE_STATION_NAME: ${{ secrets.DEPARTURE_STATION_NAME }}
          ARRIVAL_STATION_ID: ${{ secrets.ARRIVAL_STATION_ID }}
          ARRIVAL_STATION_NAME: ${{ secrets.ARRIVAL_STATION_NAME }}
          DEPARTURE_DATE: ${{ secrets.DEPARTURE_DATE }}
          UNIT_ID: ${{ secrets.UNIT_ID }}
          # Aynı gün boşalan koltuk için: her zaman bugünü kontrol et.
          CHECK_TODAY: 'true'
          CHECK_MULTIPLE_DATES: 'false'
          # 5 dakikada bir tara, ~55 dakika sonra düzgünce çık (saatler arası
          # boşluk ~5 dk kalsın; bir sonraki saatin tetiklemesi devralır).
          POLL_INTERVAL_MINUTES: '5'
          MAX_RUNTIME_MINUTES: '55'
          # Bildirim saat aralığı (Türkiye saati).
          CHECK_START: ${{ secrets.CHECK_START }}
          CHECK_END: ${{ secrets.CHECK_END }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_NOTIFICATIONS: ${{ secrets.SEND_NOTIFICATIONS }}
